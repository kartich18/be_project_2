<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login — Quantum-Safe Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .login-wrap { width:100%; max-width:420px; padding:0 20px; }
        .login-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px 36px;
            backdrop-filter: blur(20px);
        }
        .login-logo { text-align:center; margin-bottom:28px; }
        .login-logo .logo-icon { width:48px; height:48px; border-radius:12px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6); margin:0 auto 12px; }
        .login-logo h1 { font-size:1.4rem; font-weight:700; color:var(--text-primary); margin:0; }
        .login-logo .client-badge {
            display:inline-block; margin-top:6px;
            background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3);
            color:#818cf8; font-size:0.78rem; font-weight:600;
            padding:3px 10px; border-radius:20px; letter-spacing:0.05em;
        }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:0.82rem; font-weight:500;
            color:var(--text-muted); margin-bottom:6px; }
        .form-group input {
            width:100%; box-sizing:border-box;
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
            border-radius:8px; padding:12px 14px;
            color:var(--text-primary); font-family:inherit; font-size:1rem; outline:none;
            transition:border-color 0.2s;
        }
        .form-group input:focus { border-color:rgba(99,102,241,0.6); }
        .login-btn {
            width:100%; padding:13px; border:none; border-radius:8px; cursor:pointer;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff; font-family:inherit; font-size:1rem; font-weight:600;
            transition:opacity 0.2s, transform 0.15s;
        }
        .login-btn:hover { opacity:0.9; transform:translateY(-1px); }
        .login-btn:active { transform:translateY(0); }
        #login-error {
            color:#f87171; font-size:0.84rem; text-align:center;
            margin-top:12px; min-height:20px;
        }
        .server-note { text-align:center; margin-top:20px;
            font-size:0.76rem; color:var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"></div>
                <h1>Quantum-Safe Bank</h1>
                <span class="client-badge">CLIENT NODE · {{ client_id }}</span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Sign In</button>
                <div id="login-error"></div>
            </form>

            <p class="server-note">Credentials are authenticated by the central server.</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.textContent = 'Signing in…';
            btn.disabled = true;
            err.textContent = '';

            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });

            if (resp.ok) {
                window.location.href = '/';
            } else {
                const body = await resp.json().catch(() => ({}));
                err.textContent = body.error || 'Login failed. Check credentials.';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
