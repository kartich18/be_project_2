<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Quantum-Safe Bank</title>
    <meta name="description" content="Secure login to the Quantum-Safe Banking PQC dashboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base:        #090e1a;
            --bg-card:        rgba(255,255,255,0.04);
            --border:         rgba(255,255,255,0.10);
            --accent-cyan:    #00e5ff;
            --accent-purple:  #7c3aed;
            --accent-green:   #10b981;
            --text-primary:   #f0f4ff;
            --text-muted:     #6b7a99;
            --error-red:      #f87171;
            --gradient-hero:  linear-gradient(135deg, #0d1b3e 0%, #090e1a 50%, #150d2e 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient-hero);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orb-pulse 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
            top: -200px; left: -200px;
        }
        body::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,229,255,0.10) 0%, transparent 70%);
            bottom: -150px; right: -150px;
            animation-delay: -4s;
        }
        @keyframes orb-pulse {
            from { transform: scale(1) translate(0,0); }
            to   { transform: scale(1.15) translate(20px, 20px); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        /* Logo / Brand */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            gap: 12px;
        }
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 32px rgba(124,58,237,0.4);
            animation: glow-pulse 3s ease-in-out infinite alternate;
        }
        @keyframes glow-pulse {
            from { box-shadow: 0 0 20px rgba(124,58,237,0.3); }
            to   { box-shadow: 0 0 50px rgba(0,229,255,0.4); }
        }
        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand p {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Card */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .login-card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Form */
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-group input:focus {
            border-color: var(--accent-cyan);
            background: rgba(0,229,255,0.04);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.12);
        }
        .input-group input::placeholder { color: var(--text-muted); }

        /* Error message */
        #error-msg {
            display: none;
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--error-red);
            font-size: 0.82rem;
            margin-bottom: 18px;
        }
        #error-msg.visible { display: block; }

        /* Submit button */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent-purple), #5b21b6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
            letter-spacing: 0.03em;
        }
        .login-btn:hover  { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(124,58,237,0.5); }
        .login-btn:active { transform: translateY(0);    box-shadow: 0 2px 10px rgba(124,58,237,0.3); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Spinner inside button */
        .login-btn .spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-btn.loading span { display: none; }
        .login-btn.loading .spinner { display: block; }

        /* Footer note */
        .login-hint {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .login-hint a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        /* PQC badge */
        .pqc-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 10px 14px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--accent-green);
        }
        .pqc-badge::before {
            content: '🔒';
            font-size: 1em;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-icon">🏦</div>
            <h1>Quantum-Safe Bank</h1>
            <p>Post-Quantum Cryptography Node</p>
        </div>

        <div class="login-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to access the banking dashboard</p>

            <div id="error-msg" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <span>Sign In</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="pqc-badge">
                ML-KEM-768 encrypted · JWT authenticated · TLS transport
            </div>
        </div>

        <p class="login-hint">
            No account yet?
            <a href="#" id="register-link">Contact your node admin</a>
        </p>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // If already logged in, redirect to dashboard
        if (localStorage.getItem('access_token')) {
            window.location.replace('/');
        }

        const form    = document.getElementById('login-form');
        const btn     = document.getElementById('login-btn');
        const errDiv  = document.getElementById('error-msg');

        function showError(msg) {
            errDiv.textContent = msg;
            errDiv.classList.add('visible');
        }
        function clearError() {
            errDiv.textContent = '';
            errDiv.classList.remove('visible');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Login failed. Please check your credentials.');
                    return;
                }

                // Persist tokens
                localStorage.setItem('access_token',  data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                localStorage.setItem('user',          JSON.stringify(data.user));

                // Redirect to dashboard
                window.location.replace('/');

            } catch (err) {
                showError('Network error — is the server reachable?');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });
    </script>
</body>

</html>
